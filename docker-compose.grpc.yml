# Standalone legacy filename; attaches llm-service to the backend's existing network.
name: hotel-ad-image
services:
  llm-service:
    extends:
      file: docker-compose.yml
      service: llm-service
    environment:
      VLLM_BASE_URL: http://vllm:${VLLM_INTERNAL_PORT:-18080}/v1
    depends_on:
      - vllm
    networks:
      - backend-network
  vllm:
    image: vllm/vllm-openai:v0.29.0
    command:
      - Qwen/Qwen3-8B
      - --served-model-name
      - hotel-agent
      - --host
      - 0.0.0.0
      - --port
      - ${VLLM_INTERNAL_PORT:-18080}
      - --dtype
      - bfloat16
      - --max-model-len
      - "12288"
      - --max-num-seqs
      - "1"
      - --gpu-memory-utilization
      - "0.85"
    gpus: all
    ipc: host
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    networks:
      - backend-network
networks:
  backend-network:
    external: true
    name: ${BACKEND_DOCKER_NETWORK:-fastapi-backend_default}
