# Standalone legacy filename; attaches llm-service to the backend's existing network.
name: hotel-ad-image
services:
  llm-service:
    extends:
      file: docker-compose.yml
      service: llm-service
    networks:
      - backend-network
networks:
  backend-network:
    external: true
    name: ${BACKEND_DOCKER_NETWORK:-fastapi-backend_default}
