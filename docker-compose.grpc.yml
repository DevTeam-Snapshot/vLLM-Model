name: hotel-ad-image

services:
  llm-service:
    image: hotel-ad-image-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:15051:50051"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    networks:
      backend-network:

networks:
  backend-network:
    external: true
    name: ${BACKEND_DOCKER_NETWORK:-fastapi-backend_default}
